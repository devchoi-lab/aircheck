name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        env:
          ANDROID_HOME: /Users/agent/android-sdk

      # Android Instrumented Tests - main 브랜치 push 시에만 실행
      - name: Start Emulator
        if: github.event_name == 'push'
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools
          
          # 에뮬레이터 시작 (백그라운드)
          nohup emulator -avd test_avd -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          
          # 부팅 대기 (최대 2분, macOS 호환)
          adb wait-for-device
          SECONDS=0
          while [[ -z $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') ]]; do
            if [[ $SECONDS -gt 120 ]]; then
              echo "Emulator boot timeout"
              exit 1
            fi
            sleep 2
          done
          echo "Emulator booted in ${SECONDS}s"

      - name: Run Instrumented Tests
        if: github.event_name == 'push'
        run: ./gradlew :core:data:connectedDebugAndroidTest
        env:
          ANDROID_HOME: /Users/agent/android-sdk

      - name: Stop Emulator
        if: github.event_name == 'push' && always()
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          adb emu kill || true

      - name: Upload Test Results
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: core/data/build/reports/androidTests/
          retention-days: 7

  build:
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Decode Keystore
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
        env:
          ANDROID_HOME: /Users/agent/android-sdk

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aircheck-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Deploy to Firebase App Distribution
        if: github.event_name == 'push'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # 서비스 계정 JSON 파일 생성
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          
          # Firebase CLI로 배포
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "testers" \
            --release-notes "Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Message: ${{ github.event.head_commit.message }}"
          
          # 임시 파일 삭제
          rm -f /tmp/firebase-sa.json
