name: CI Dev

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Lint
        run: ./gradlew lintDebug
        env:
          ANDROID_HOME: /Users/agent/android-sdk

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        env:
          ANDROID_HOME: /Users/agent/android-sdk

      - name: Start Emulator
        if: github.event_name == 'push'
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools

          nohup emulator -avd test_avd -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &

          adb wait-for-device
          SECONDS=0
          while [[ -z $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') ]]; do
            if [[ $SECONDS -gt 120 ]]; then
              echo "Emulator boot timeout"
              exit 1
            fi
            sleep 2
          done
          echo "Emulator booted in ${SECONDS}s"

      - name: Run Instrumented Tests
        if: github.event_name == 'push'
        run: ./gradlew :core:data:connectedDebugAndroidTest
        env:
          ANDROID_HOME: /Users/agent/android-sdk

      - name: Stop Emulator
        if: github.event_name == 'push' && always()
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          adb emu kill || true

  build:
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
        env:
          ANDROID_HOME: /Users/agent/android-sdk